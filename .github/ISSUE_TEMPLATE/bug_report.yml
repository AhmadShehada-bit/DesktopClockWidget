name: "🐛 Report a Bug"
description: "Create a report to help us fix a defect in DesktopClock Widget."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report
        Please fill out the information below to help us reproduce and resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the unexpected behavior..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior:"
      value: |
        1. Launch DesktopClockWidget
        2. Open Settings Window
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "The widget should..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
      placeholder: "Instead, it did..."
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: "Windows Version"
      placeholder: "e.g., Windows 11 23H2 (Build 22631.3007) or Windows 10 Pro 22H2"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "App Version / Commit"
      placeholder: "e.g., v1.0.1 or latest main"
    validations:
      required: true
  - type: textarea
    id: additional_info
    attributes:
      label: "Screenshots / Logs / Additional Details"
      description: "Paste screenshots or error messages if applicable."
      placeholder: "Attach images or details here..."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "I am using the latest available release or build."
          required: true
