ShortDescription: A lightweight, highly customizable Windows desktop clock widget with aesthetic themes, weather, system metrics, and world timezones.
Description: |
  DesktopClock Widget is an ultra-lightweight, customizable desktop clock for Windows 10 and 11.
  Features:
  - 10 curated aesthetic themes (Cyberpunk, Minimalist, Serif, Handwritten, HUD, Neon)
  - Zero-visual-jitter dynamic text envelopes for seamless second/minute/date updates
  - 217+ curated bundled fonts with fast mouse-wheel font browsing and LRU caching
  - Optional lightweight modules (Open-Meteo weather with offline caching, CPU & RAM metrics)
  - Secondary world timezone clocks with automatic DST conversion
  - Multi-monitor placement and Per-Monitor DPI scaling awareness
  - Pure native WPF + Win32 architecture with zero telemetry and zero WebView2/Chromium overhead
